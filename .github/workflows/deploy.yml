# Builds the Vite site and publishes dist/ to the `gh-pages` branch.
# In the repository: Settings → Pages → Source: "Deploy from a branch",
# Branch: gh-pages / (root).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check and build
        run: npm run build

      # The branch holds the latest build plus the previous build's assets.
      # GitHub Pages lets browsers cache index.html for 10 minutes, so a visitor
      # may still load the old page right after a deploy; keeping the files it
      # points to means they see the previous version instead of a blank page.
      - name: Publish dist to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git clone -q --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ../previous; then
            for f in $(grep -o 'assets/[^"]*' ../previous/index.html | sort -u); do
              if [ ! -f "$f" ] && [ -f "../previous/$f" ]; then
                cp "../previous/$f" "$f"
                echo "kept previous $f"
              fi
            done
          fi
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
